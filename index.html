<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>迷你世界 3.0 创造模式 · Lua 脚本验证器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#0d1526;color:#e8eef7}
#app{display:flex;flex-direction:column;height:100%}
/* 顶栏 */
#top{background:#16233f;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #24365c}
#top h1{font-size:14px;font-weight:600;flex:1}
#top .stat{font-size:11px;color:#8fa8cc;background:#1d2c4d;padding:3px 7px;border-radius:5px}
/* 画布 */
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:8px;top:8px;font-size:11px;color:#7d94b8;background:rgba(13,21,38,.75);padding:4px 8px;border-radius:5px;pointer-events:none}
/* 摇杆 */
#joy{position:absolute;left:12px;bottom:12px;width:96px;height:96px;border-radius:50%;background:rgba(30,45,75,.55);border:2px solid #2c4270;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#4a7fd4;box-shadow:0 2px 8px rgba(0,0,0,.4)}
/* 动作键 */
#acts{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.act{width:52px;height:52px;border-radius:50%;background:rgba(74,127,212,.85);border:none;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.15}
.act:active{background:#3a68b0}
/* 底部面板 */
#panel{height:46%;background:#101a30;border-top:1px solid #24365c;display:flex;flex-direction:column}
#tabs{display:flex;background:#16233f;border-bottom:1px solid #24365c}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:12px;color:#8fa8cc;border:none;background:none}
.tab.on{color:#6ea8ff;border-bottom:2px solid #6ea8ff;font-weight:600}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:8px}
.pane.on{display:flex;flex-direction:column}
textarea{flex:1;width:100%;background:#0a1224;color:#d6e4f7;border:1px solid #24365c;border-radius:6px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;resize:none;min-height:120px}
#run{margin-top:8px;padding:11px;background:#2e7d4f;border:none;color:#fff;border-radius:7px;font-size:14px;font-weight:600}
#run:active{background:#256a41}
#run.stop{background:#a33}
#console{flex:1;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.6;background:#0a1224;border:1px solid #24365c;border-radius:6px;padding:8px}
#console div{margin-bottom:2px;word-break:break-all}
.c-ok{color:#5ddc9a}.c-warn{color:#ffc14d}.c-err{color:#ff7b72}.c-chat{color:#9fd0ff}.c-info{color:#8fa8cc}
#presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ps{padding:10px 8px;background:#1a2848;border:1px solid #2c4270;border-radius:7px;color:#cfe0f7;font-size:12px;text-align:left;line-height:1.35}
.ps:active{background:#24365c}
.ps b{display:block;font-size:12px;color:#fff;margin-bottom:2px}
.ps span{font-size:10px;color:#8fa8cc}
#chatbox{position:absolute;left:8px;top:34px;width:62%;pointer-events:none}
.chatline{background:rgba(13,21,38,.8);color:#9fd0ff;font-size:11px;padding:3px 7px;border-radius:4px;margin-bottom:3px;animation:fade 6s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>迷你世界 3.0 · 创造模式验证器</h1>
    <span class="stat" id="s-block">方块 0</span>
    <span class="stat" id="s-mob">生物 0</span>
    <span class="stat" id="s-ev">事件 0</span>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">拖动摇杆移动 · 点方块触发 ClickBlock</div>
    <div id="chatbox"></div>
    <div id="joy"><div id="knob"></div></div>
    <div id="acts">
      <button class="act" id="btn-jump">跳<br>跃</button>
      <button class="act" id="btn-hit">攻<br>击</button>
    </div>
  </div>

  <div id="panel">
    <div id="tabs">
      <button class="tab on" data-p="p-code">📝 脚本</button>
      <button class="tab" data-p="p-con">💬 控制台</button>
      <button class="tab" data-p="p-pre">⚡ 预设</button>
    </div>

    <div class="pane on" id="p-code">
      <textarea id="code" spellcheck="false"></textarea>
      <button id="run">▶ 运行脚本</button>
    </div>

    <div class="pane" id="p-con">
      <div id="console"></div>
    </div>

    <div class="pane" id="p-pre">
      <div id="presets"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   MiniLua —— 迷你世界 3.0 创造模式 Lua 子集解释器
   支持：local/global 变量、function、if/elseif/else、for/while、
        表、obj:method() 与 obj.method()、字符串、注释、return
   ============================================================ */
(function (global) {
'use strict';

/* ---------- 词法分析 ---------- */
const KEYWORDS = new Set(['local','function','end','if','then','elseif','else','for',
  'in','while','do','return','break','nil','true','false','and','or','not']);

function tokenize(src) {
  const toks = []; let i = 0, line = 1;
  const n = src.length;
  const isAlpha = c => /[A-Za-z_\u4e00-\u9fa5]/.test(c);
  const isAlnum = c => /[A-Za-z0-9_\u4e00-\u9fa5]/.test(c);
  const isDigit = c => /[0-9]/.test(c);

  while (i < n) {
    let c = src[i];
    // 换行
    if (c === '\n') { line++; i++; continue; }
    if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }

    // 长注释 --[[ ]]  或 --[==[ ]==]
    if (c === '-' && src[i+1] === '-') {
      i += 2;
      if (src[i] === '[') {
        let eq = 0, j = i + 1;
        while (src[j] === '=') { eq++; j++; }
        if (src[j] === '[') {
          const close = ']' + '='.repeat(eq) + ']';
          const end = src.indexOf(close, j + 1);
          i = (end === -1) ? n : end + close.length;
          continue;
        }
      }
      while (i < n && src[i] !== '\n') i++;
      continue;
    }
    // 长字符串 [[ ]] / [==[ ]==]
    if (c === '[') {
      let eq = 0, j = i + 1;
      while (src[j] === '=') { eq++; j++; }
      if (src[j] === '[') {
        const close = ']' + '='.repeat(eq) + ']';
        let end = src.indexOf(close, j + 1);
        if (end === -1) end = n;
        const raw = src.slice(j + 1, end);
        // Lua 规范：紧随开括号的换行被忽略
        const val = raw.startsWith('\n') ? raw.slice(1) : raw;
        toks.push({ t: 'str', v: val, line });
        while (i < end + close.length) { if (src[i] === '\n') line++; i++; }
        continue;
      }
    }
    // 短字符串
    if (c === '"' || c === "'") {
      const q = c; i++; let s = '';
      while (i < n && src[i] !== q) {
        if (src[i] === '\\') {
          i++; const e = src[i];
          s += (e === 'n') ? '\n' : (e === 't') ? '\t' : (e === 'r') ? '\r' : e;
          i++;
        } else { s += src[i]; i++; }
      }
      i++; toks.push({ t: 'str', v: s, line }); continue;
    }
    // 数字
    if (isDigit(c) || (c === '.' && isDigit(src[i+1]))) {
      let s = '';
      while (i < n && (isDigit(src[i]) || src[i] === '.')) { s += src[i]; i++; }
      toks.push({ t: 'num', v: parseFloat(s), line }); continue;
    }
    // 标识符 / 关键字
    if (isAlpha(c)) {
      let s = '';
      while (i < n && isAlnum(src[i])) { s += src[i]; i++; }
      toks.push({ t: KEYWORDS.has(s) ? 'kw' : 'id', v: s, line }); continue;
    }
    // 多字符运算符
    const ops3 = ['...'];
    const ops2 = ['==','~=','<=','>=','..','//','::'];
    let matched = null;
    for (const o of ops3) if (src.startsWith(o, i)) { matched = o; break; }
    if (!matched) for (const o of ops2) if (src.startsWith(o, i)) { matched = o; break; }
    if (matched) { toks.push({ t: 'op', v: matched, line }); i += matched.length; continue; }
    // 单字符
    if ('+-*/%^#<>=(){}[];,:.'.includes(c)) {
      toks.push({ t: 'op', v: c, line }); i++; continue;
    }
    i++; // 跳过未知字符
  }
  toks.push({ t: 'eof', v: '<eof>', line });
  return toks;
}

/* ---------- 语法分析（递归下降） ---------- */
function parse(src) {
  const toks = tokenize(src);
  let p = 0;
  const peek = (k=0) => toks[p+k];
  const at = (type, val) => {
    const t = toks[p];
    return (t.t === type && (val === undefined || t.v === val));
  };
  const eat = (type, val) => {
    if (!at(type, val)) throw new Error(`语法错误(line ${toks[p].line}): 期望 ${val||type} 实际 ${toks[p].v}`);
    return toks[p++];
  };
  const opt = (type, val) => { if (at(type, val)) { p++; return true; } return false; };

  function block(terminators) {
    const body = [];
    while (true) {
      const t = toks[p];
      if (t.t === 'eof') break;
      if (t.t === 'kw' && terminators.includes(t.v)) break;
      const st = statement();
      if (st) body.push(st);
      opt('op', ';');
    }
    return body;
  }

  function namelist() {
    const names = [eat('id').v];
    while (opt('op', ',')) names.push(eat('id').v);
    return names;
  }
  function exprlist() {
    const es = [expr()];
    while (opt('op', ',')) es.push(expr());
    return es;
  }

  // 后缀表达式：索引 / 调用 / 方法
  function suffix(base) {
    let e = base;
    while (true) {
      if (at('op', '.')) {
        p++; const key = eat('id').v;
        e = { k: 'index', obj: e, key: { k: 'str', v: key } };
      } else if (at('op', ':')) {
        p++; const m = eat('id').v;
        let args = [];
        if (at('op', '(')) { p++; if (!at('op',')')) args = exprlist(); eat('op',')'); }
        else if (at('str')) { args = [{ k: 'str', v: toks[p++].v }]; }
        else if (at('op','{')) { p++; args = [tableCtor()]; }
        e = { k: 'mcall', obj: e, method: m, args, self: true };
      } else if (at('op', '[')) {
        p++; const key = expr(); eat('op', ']');
        e = { k: 'index', obj: e, key };
      } else if (at('op', '(')) {
        p++; let args = [];
        if (!at('op', ')')) args = exprlist();
        eat('op', ')');
        e = { k: 'call', fn: e, args };
      } else if (at('str')) {
        e = { k: 'call', fn: e, args: [{ k: 'str', v: toks[p++].v }] };
      } else if (at('op', '{')) {
        p++; e = { k: 'call', fn: e, args: [tableCtor()] };
      } else break;
    }
    return e;
  }

  function tableCtor() {
    const items = [];
    while (!at('op', '}')) {
      if (at('op', '[')) {
        p++; const k = expr(); eat('op', ']'); eat('op', '=');
        items.push({ key: k, val: expr() });
      } else if (at('id') && toks[p+1].t === 'op' && toks[p+1].v === '=') {
        const k = { k: 'str', v: toks[p++].v }; p++;
        items.push({ key: k, val: expr() });
      } else {
        items.push({ val: expr() });
      }
      if (!opt('op', ',')) break;
    }
    eat('op', '}');
    return { k: 'table', items };
  }

  function primary() {
    const t = toks[p];
    if (t.t === 'num') { p++; return { k: 'num', v: t.v }; }
    if (t.t === 'str') { p++; return { k: 'str', v: t.v }; }
    if (t.t === 'kw') {
      if (t.v === 'nil')   { p++; return { k: 'nil' }; }
      if (t.v === 'true')  { p++; return { k: 'bool', v: true }; }
      if (t.v === 'false') { p++; return { k: 'bool', v: false }; }
      if (t.v === 'function') { p++; return funcBody(); }
      if (t.v === 'not')   { p++; return { k: 'unop', op: 'not', a: exprPrec(8) }; }
    }
    if (t.t === 'id') { p++; return { k: 'var', name: t.v }; }
    if (t.t === 'op' && t.v === '(') { p++; const e = expr(); eat('op', ')'); return { k: 'paren', e }; }
    if (t.t === 'op' && t.v === '{') { p++; return tableCtor(); }
    if (t.t === 'op' && (t.v === '-' || t.v === '#')) {
      p++; return { k: 'unop', op: t.v, a: exprPrec(8) };
    }
    throw new Error(`语法错误(line ${t.line}): 意外的 ${t.v}`);
  }

  const PREC = { 'or':1, 'and':2, '<':3,'>':3,'<=':3,'>=':3,'~=':3,'==':3,
                 '..':5, '+':6,'-':6, '*':7,'/':7,'%':7, '^':9 };
  // 原子表达式 + 后缀（.索引 / :方法 / ()调用 / []索引）
  function postfixExpr() { return suffix(primary()); }

  function exprPrec(minPrec) {
    let lhs = postfixExpr();
    while (true) {
      const t = toks[p];
      if (t.t !== 'op') break;
      const pr = PREC[t.v];
      if (pr === undefined || pr < minPrec) break;
      p++;
      // 右结合 ^ 和 ..
      const nextMin = (t.v === '^' || t.v === '..') ? pr : pr + 1;
      const rhs = exprPrec(nextMin);
      lhs = { k: 'binop', op: t.v, a: lhs, b: rhs };
    }
    return lhs;
  }
  const expr = () => exprPrec(1);

  function funcBody() {
    eat('op', '(');
    const params = [];
    if (at('id') || at('op','...')) {
      if (at('op','...')) { p++; params.push('...'); }
      else { params.push(eat('id').v);
        while (opt('op', ',')) {
          if (at('op','...')) { p++; params.push('...'); break; }
          params.push(eat('id').v);
        } }
    }
    eat('op', ')');
    const body = block(['end']);
    eat('kw', 'end');
    return { k: 'func', params, body };
  }

  function statement() {
    const t = toks[p];
    // local
    if (t.t === 'kw' && t.v === 'local') {
      p++;
      if (at('kw', 'function')) {
        p++; const name = eat('id').v;
        const fn = funcBody();
        return { k: 'localfn', name, fn };
      }
      const names = namelist();
      let inits = [];
      if (opt('op', '=')) inits = exprlist();
      return { k: 'local', names, inits };
    }
    // function name(...)  /  function a.b.c(...) / function a:b(...)
    if (t.t === 'kw' && t.v === 'function') {
      p++;
      const base = eat('id').v;
      let e = { k: 'var', name: base };
      let isMethod = false;
      while (true) {
        if (at('op', '.')) { p++; e = { k: 'index', obj: e, key: { k: 'str', v: eat('id').v } }; }
        else if (at('op', ':')) { p++; e = { k: 'index', obj: e, key: { k: 'str', v: eat('id').v } }; isMethod = true; break; }
        else break;
      }
      const fn = funcBody();
      if (isMethod) fn.params.unshift('self');
      return { k: 'assign', target: e, val: fn };
    }
    // if
    if (t.t === 'kw' && t.v === 'if') {
      p++; const clauses = [];
      const cond = expr(); eat('kw', 'then');
      clauses.push({ cond, body: block(['elseif','else','end']) });
      while (at('kw', 'elseif')) {
        p++; const c2 = expr(); eat('kw', 'then');
        clauses.push({ cond: c2, body: block(['elseif','else','end']) });
      }
      if (at('kw', 'else')) { p++; clauses.push({ cond: null, body: block(['end']) }); }
      eat('kw', 'end');
      return { k: 'if', clauses };
    }
    // while
    if (t.t === 'kw' && t.v === 'while') {
      p++; const cond = expr(); eat('kw', 'do');
      const body = block(['end']); eat('kw', 'end');
      return { k: 'while', cond, body };
    }
    // for
    if (t.t === 'kw' && t.v === 'for') {
      p++;
      const n1 = eat('id').v;
      if (opt('op', '=')) {
        const start = expr(); eat('op', ',');
        const stop = expr();
        let step = null;
        if (opt('op', ',')) step = expr();
        eat('kw', 'do');
        const body = block(['end']); eat('kw', 'end');
        return { k: 'numfor', var: n1, start, stop, step, body };
      }
      // generic for
      const vars = [n1];
      while (opt('op', ',')) vars.push(eat('id').v);
      eat('kw', 'in');
      const iter = exprlist();
      eat('kw', 'do');
      const body = block(['end']); eat('kw', 'end');
      return { k: 'genfor', vars, iter, body };
    }
    // return
    if (t.t === 'kw' && t.v === 'return') {
      p++;
      let vals = [];
      if (!at('kw','end') && !at('eof') && !(at('kw','else')) && !(at('kw','elseif'))) {
        vals = exprlist();
      }
      return { k: 'return', vals };
    }
    if (t.t === 'kw' && t.v === 'break') { p++; return { k: 'break' }; }
    if (t.t === 'kw' && t.v === 'do') {
      p++; const body = block(['end']); eat('kw','end'); return { k: 'dostmt', body };
    }
    // 赋值或调用
    if (t.t === 'id' || (t.t === 'op' && t.v === '(')) {
      const e = exprPrec(1);
      // 判断是否是赋值目标
      if (at('op', ',')) {
        p++; const rest = exprlist();
        eat('op', '='); const vals = exprlist();
        return { k: 'assign', target: { k:'multi', items:[e,...rest] }, val: { k:'multi', items: vals } };
      }
      if (at('op', '=')) {
        p++; const vals = exprlist();
        return { k: 'assign', target: e, val: vals.length>1 ? {k:'multi',items:vals} : vals[0] };
      }
      // 裸调用
      return { k: 'exprstmt', e: suffix(e) };
    }
    // 跳过无法识别的 token
    p++;
    return null;
  }

  const ast = block([]);
  return ast;
}

/* ---------- 运行时 ---------- */
const BREAK = Symbol('break');
const RETURN = Symbol('return');

function toStr(v) {
  if (v === null || v === undefined) return 'nil';
  if (v === true) return 'true';
  if (v === false) return 'false';
  if (typeof v === 'string') return v;
  if (typeof v === 'number') return (Number.isInteger(v)) ? String(v) : String(v);
  if (typeof v === 'function') return 'function';
  if (Array.isArray(v)) return 'table';
  if (typeof v === 'object') return v.__str__ || 'table';
  return String(v);
}
function truthy(v) { return v !== false && v !== null && v !== undefined && v !== 0 && v !== ''; }

function arith(op, a, b) {
  const x = (typeof a === 'string') ? parseFloat(a) : a;
  const y = (typeof b === 'string') ? parseFloat(b) : b;
  if ((typeof x !== 'number' || isNaN(x)) || (typeof y !== 'number' || isNaN(y))) {
    throw new Error(`算术错误: 无法对 ${toStr(a)} 和 ${toStr(b)} 做 ${op}`);
  }
  switch (op) {
    case '+': return x + y; case '-': return x - y;
    case '*': return x * y; case '/': return y === 0 ? (x>0?Infinity:-Infinity) : x / y;
    case '%': return y === 0 ? 0 : x % y;
    case '^': return Math.pow(x, y);
  }
}

class LuaFunc {
  constructor(node, env) { this.node = node; this.env = env; this.isLua = true; }
}

class Interp {
  constructor(apiObjects) {
    this.global = Object.create(null);
    this.api = apiObjects || {};
    this.hooks = {};
    this._installBase();
  }
  _installBase() {
    const g = this.global;
    g.print = (...a) => this.log(a.map(toStr).join('\t'));
    g.type = v => {
      if (typeof v === 'string') return 'string';
      if (typeof v === 'number') return 'number';
      if (typeof v === 'boolean') return 'boolean';
      if (typeof v === 'function' || v instanceof LuaFunc) return 'function';
      if (v === null || v === undefined) return 'nil';
      return 'table';
    };
    g.tostring = toStr;
    g.tonumber = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
    g.math = {
      floor: Math.floor, ceil: Math.ceil, abs: Math.abs, max: Math.max, min: Math.min,
      random: (a,b) => {
        if (a === undefined) return Math.random();
        if (b === undefined) return Math.floor(Math.random()*a)+1;
        return Math.floor(Math.random()*(b-a+1))+a;
      },
      sqrt: Math.sqrt, sin: Math.sin, cos: Math.cos, pi: Math.PI, huge: Infinity,
      randomseed: ()=>{}
    };
    g.string = {
      len: s => toStr(s).length,
      sub: (s,i,j) => { const t=toStr(s); const a=(i<0? t.length+i : i-1); return j===undefined? t.slice(a) : t.slice(a,j); },
      format: (f, ...a) => {
        let out = toStr(f), k = 0;
        out = out.replace(/%d/g, () => toStr(a[k++]));
        out = out.replace(/%s/g, () => toStr(a[k++]));

<script>
/* ============================================================

(function (global) {

  6:  { name: '树叶',   top: '#4a8c34',        side: '#3f7a2c' },
  7:  { name: '沙子',   top: '#e0d29a',        side: '#cfc189' },
  8:  { name: '雪',     top: '#f2f7fa',        side: '#e2eaf0' },
  9:  { name: '砖块',   top: '#b04a3a',        side: '#9c4032' },
  10: { name: '基岩',   top: '#4a4a4a',        side: '#3a3a3a' },

/* 生物定义 */

  2: { name: '小猪',   color: '#f0a8b8', size: 0.7, hp: 20 },
  3: { name: '野人',   color: '#8a6a4a', size: 0.9, hp: 40 },
  4: { name: '僵尸',   color: '#5a8a4a', size: 0.9, hp: 35 },
  5: { name: '爆爆蛋', color: '#d8d8d8', size: 0.6, hp: 15 },
  6: { name: '狼',     color: '#7a7a8a', size: 0.8, hp: 30 },
};

/* ---------------- 世界 ---------------- */
const W = 32, H = 12, D = 32;   // 世界尺寸 (x, y, z)

class World {
  constructor() {

  inside(x, y, z) { return x >= 0 && x < W && y >= 0 && y < H && z >= 0 && z < D; }

    x = Math.floor(x); y = Math.floor(y); z = Math.floor(z);
    if (!this.inside(x, y, z)) return 0;

/* ---------------- 等距渲染器 ---------------- */
const TW = 34, TH = 17, BH = 17;   // 菱形宽/高，层高

        const z = s - x;

          if (id === 0) continue;

              this.world.get(x, y + 1, z + 1) !== 0 &&

    ctx.moveTo(p.sx + zw / 2, p.sy);
    ctx.lineTo(p.sx, p.sy + zh / 2);
    ctx.lineTo(p.sx, p.sy + zh / 2 + bh);
    ctx.lineTo(p.sx + zw / 2, p.sy + bh);

      ctx.fillStyle = '#000'; ctx.fillRect(p.sx - 10 * s, p.sy - hpx - 8, 20 * s, 3);

    const p = this.iso(pl.x, pl.y, pl.z);

    // 头
    ctx.fillStyle = '#f5d0a9';
    ctx.beginPath(); ctx.ellipse(p.sx, p.sy - 30 * s, 7 * s, 7 * s, 0, 0, 7); ctx.fill();
    // 头发
    ctx.fillStyle = '#4a3728';
    ctx.beginPath(); ctx.ellipse(p.sx, p.sy - 33 * s, 7 * s, 4 * s, 0, Math.PI, 0); ctx.fill();
    // 名牌
    ctx.fillStyle = '#fff'; ctx.font = `${11 * s}px sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('玩家', p.sx, p.sy - 44 * s);
  }
}
function shade(hex, amt) {
  const c = hex.replace('#', '');
  const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

/* ---------------- 玩家 / 生物 ---------------- */
class Player {
  constructor(world) {
    this.world = world;
    this.x = W / 2; this.z = D / 2;
    this.y = world.heightAt(Math.floor(this.x), Math.floor(this.z)) + 1;
    this.hp = 100; this.maxHp = 100;
    this.team = 1;
    this.name = '玩家';
  }
  teleport(x, y, z) {
    this.x = x; this.z = z;
    if (y === undefined || y === null) this.y = this.world.heightAt(Math.floor(x), Math.floor(z)) + 1;
    else this.y = y;
  }
  move(dx, dz) {
    const nx = this.x + dx, nz = this.z + dz;
    if (nx < 0 || nx >= W || nz < 0 || nz >= D) return;
    const floor = this.world.heightAt(Math.floor(nx), Math.floor(nz));
    let ny = floor + 1;
    // 简单攀爬：最多上 1 格，下落不限
    if (ny - this.y > 1) return;      // 太高，挡住
    this.x = nx; this.z = nz; this.y = ny;
  }
}

class Mob {
  constructor(world, objid, type, x, y, z) {
    this.world = world; this.objid = objid; this.type = type;
    this.x = x; this.z = z; this.y = y;
    const d = MOBS[type] || MOBS[1];
    this.hp = d.hp; this.maxHp = d.hp;
    this.dir = Math.random() * Math.PI * 2;
    this.moveTimer = 0;
  }
  update() {
    this.moveTimer--;
    if (this.moveTimer <= 0) {
      this.moveTimer = 30 + Math.floor(Math.random() * 60);
      this.dir = Math.random() * Math.PI * 2;
    }
    const sp = 0.05;
    let nx = this.x + Math.cos(this.dir) * sp;
    let nz = this.z + Math.sin(this.dir) * sp;
    if (nx < 0 || nx >= W - 1 || nz < 0 || nz >= D - 1) { this.dir += Math.PI; return; }
    const floor = this.world.heightAt(Math.floor(nx), Math.floor(nz));
    if (floor < 0 || Math.abs(floor - this.y) > 1) { this.dir += Math.PI / 2; return; }
    this.x = nx; this.z = nz; this.y = floor + 1;
  }
}

/* ---------------- 迷你世界真实 API 绑定 ---------------- */
function buildAPI(world, player, bus) {
  const log = (...a) => bus.log(a.map(x => typeof x === 'object' ? JSON.stringify(x) : String(x)).join(' '));

  /* --- Block 方块操作 --- */
  const Block = {
    setBlockAll(self, x, y, z, blockid, face) {
      const ok = world.set(x, y, z, blockid);
      bus.stats.blocks += ok ? 1 : 0;
      if (!ok) log(`⚠ setBlockAll 越界: (${x},${y},${z})`);
      bus.emit('Block.Add', { x, y, z, blockid });
      return ok;
    },
    getBlockID(self, x, y, z) { return world.get(Math.round(x), Math.round(y), Math.round(z)); },
    clearBlock(self, x, y, z) {
      const ok = world.set(x, y, z, 0);
      if (ok) bus.emit('Block.Remove', { x, y, z });
      return ok;
    },
    getBlockName(self, x, y, z) { return blockName(world.get(x, y, z)); },
    // 区域填充（真实 API: AreaReplace 类）
    fillArea(self, x1, y1, z1, x2, y2, z2, blockid) {
      let n = 0;
      const ax = Math.min(x1, x2), bx = Math.max(x1, x2);
      const ay = Math.min(y1, y2), by = Math.max(y1, y2);
      const az = Math.min(z1, z2), bz = Math.max(z1, z2);
      for (let x = ax; x <= bx; x++) for (let y = ay; y <= by; y++) for (let z = az; z <= bz; z++) {
        if (world.set(x, y, z, blockid)) n++;
      }
      bus.stats.blocks += n;
      log(`✓ fillArea 填充 ${n} 个方块 → ${blockName(blockid)}`);
      return n;
    },
    replaceArea(self, x1, y1, z1, x2, y2, z2, fromid, toid) {
      let n = 0;
      const ax = Math.min(x1,x2), bx = Math.max(x1,x2);
      const ay = Math.min(y1,y2), by = Math.max(y1,y2);
      const az = Math.min(z1,z2), bz = Math.max(z1,z2);
      for (let x=ax;x<=bx;x++) for (let y=ay;y<=by;y++) for (let z=az;z<=bz;z++) {
        if (world.get(x,y,z) === fromid && world.set(x,y,z,toid)) n++;
      }
      log(`✓ replaceArea 替换 ${n} 个方块 ${blockName(fromid)}→${blockName(toid)}`);
      return n;
    }
  };

  /* --- World 世界 --- */
  const World_ = {
    spawnCreature(self, x, y, z, actorid, num) {
      const n = num || 1;
      const ids = [];
      for (let i = 0; i < n; i++) {
        const objid = world.nextObjId++;
        const m = new Mob(world, objid, actorid || 1,
          x + (Math.random() - 0.5) * 2, y, z + (Math.random() - 0.5) * 2);
        m.y = world.heightAt(Math.floor(m.x), Math.floor(m.z)) + 1;
        world.mobs.push(m);
        ids.push(objid);
      }
      bus.stats.mobs += n;
      log(`✓ spawnCreature 生成 ${n} 只 ${MOBS[actorid] ? MOBS[actorid].name : actorid} (objid=${ids.join(',')})`);
      bus.emit('Actor.Create', { objid: ids[0], actorid });
      return n === 1 ? ids[0] : ids;
    },
    clearMob(self) { const n = world.mobs.length; world.mobs.length = 0; log(`✓ clearMob 清除 ${n} 只生物`); return n; },
    getMobNum(self) { return world.mobs.length; },
    getHeight(self, x, z) { return world.heightAt(x, z); },
    setGameTime(self, hour) { world.gameTime = hour; bus.emit('Game.Hour', { hour }); return true; },
    getGameTime(self) { return world.gameTime; },
    playSound(self, x, y, z, soundid, vol) { log(`♪ playSound(${soundid})`); return true; }
  };

  /* --- Actor 生物 --- */
  const Actor = {
    spawnCreature(self, x, y, z, actorid, num) { return World_.spawnCreature(x, y, z, actorid, num); },
    kill(self, objid) {

      if (i < 0) { log(`⚠ kill: objid ${objid} 不存在`); return false; }
      world.mobs.splice(i, 1);
      bus.emit('Actor.Die', { objid });
      log(`✓ kill 消灭 objid=${objid}`);
      return true;
    },
    clearAll(self) { return World_.clearMob(); },
    getCount(self) { return world.mobs.length; }
  };

  /* --- Player 玩家 --- */
  const Player_ = {
    getPosition(self, uin) {
      return { x: Math.round(player.x), y: Math.round(player.y), z: Math.round(player.z) };
    },
    setPosition(self, x, y, z) { player.teleport(x, y, z); log(`✓ 玩家传送到 (${x},${y},${z})`); return true; },
    getHp(self) { return player.hp; },
    setHp(self, v) { player.hp = Math.max(0, Math.min(player.maxHp, v)); return true; },
    getTeam(self) { return player.team; },
    setTeam(self, t) { player.team = t; return true; },
    getName(self) { return player.name; },
    addItem(self, itemid, num) { log(`✓ 获得物品 ${itemid} ×${num || 1}`); bus.stats.items += (num||1); return true; },
    setItem(self, itemid, num) { return Player_.addItem(itemid, num); }
  };

  /* --- ScriptSupportEvent 事件注册（核心） --- */
  const ScriptSupportEvent = {
    registerEvent(self, eventName, fn) {
      if (typeof eventName !== 'string') { log('⚠ registerEvent: 事件名必须是字符串'); return false; }
      if (!fn) { log('⚠ registerEvent: 回调函数为空'); return false; }
      bus.on(eventName, fn);
      log(`✓ 已注册事件 [${eventName}]`);
      bus.stats.events++;
      return true;
    },
    unRegisterEvent(self, eventName) { bus.off(eventName); return true; }
  };

  /* --- ClientCurGame 计分/聊天（官方脚本常用） --- */
  const ClientCurGame = {
    sendChat(self, msg, type) {
      bus.chat(String(msg), type);
      return true;
    },
    setTeamScore(self, team, score) {
      world.teamScore[team] = score;
      log(`✓ 队伍${team} 分数 = ${score}`);
      return true;
    },
    addTeamScore(self, team, delta) {
      world.teamScore[team] = (world.teamScore[team] || 0) + delta;
      return world.teamScore[team];
    },
    getTeamScore(self, team) { return world.teamScore[team] || 0; },
    getNumPlayers(self, team) { return team === 1 ? 1 : 0; },
    setTeamResults(self, a, b) { log(`✓ 队伍结果: ${a} / ${b}`); return true; },
    setPlayersResults(self, a, b) { log(`✓ 玩家结果: ${a} / ${b}`); return true; },
    getRound(self) { return world.tick; }
  };

  /* --- Chat --- */
  const Chat = {
    sendSystemMsg(self, msg) { bus.chat('[系统] ' + msg); return true; },
    sendChat(self, msg) { bus.chat(String(msg)); return true; }
  };

  /* --- Game --- */
  const Game = {
    getTick(self) { return world.tick; },
    setVar(self, k, v) { world.vars[k] = v; return true; },
    getVar(self, k) { return world.vars[k] !== undefined ? world.vars[k] : 0; },
    endGame(self, result) { log(`✓ 游戏结束 result=${result}`); bus.emit('Game.End', { result }); return true; },
    victory(self, uin) { log('✓ 玩家胜利'); bus.emit('Game.AnyPlayer.Victory', { uin }); return true; },
    defeat(self, uin) { log('✓ 玩家失败'); bus.emit('Game.AnyPlayer.Defeat', { uin }); return true; }
  };

  /* --- Area 区域（地形与区域类 API） --- */
  const Area = {
    create(self, x1, y1, z1, x2, y2, z2) {
      const id = (world.vars.__areaId = (world.vars.__areaId || 0) + 1);
      log(`✓ 创建区域 #${id} (${x1},${y1},${z1})→(${x2},${y2},${z2})`);
      return id;
    },
    checkIfPosInArea(self, x, y, z, x1, y1, z1, x2, y2, z2) {
      return (x >= Math.min(x1,x2) && x <= Math.max(x1,x2) &&
              y >= Math.min(y1,y2) && y <= Math.max(y1,y2) &&
              z >= Math.min(z1,z2) && z <= Math.max(z1,z2));
    }
  };

  /* --- Trigger 触发器 --- */
  const Trigger = {
    create(self, name) { log(`✓ 创建触发器 [${name}]`); return true; },
    run(self, name) { log(`✓ 运行触发器 [${name}]`); bus.emit('Block.Trigger', { name }); return true; }
  };

  /* --- UI --- */
  const UI = {
    showTip(self, msg) { bus.chat('[提示] ' + msg); return true; },
    setHP(self, hp) { player.hp = hp; return true; }
  };

  // 本地化字符串（模拟 GetS）

      8023: '人类胜利！', 8024: '野人胜利！', 8001: '游戏开始',
    };
    return table[id] || ('文本' + id);
  }

  return {
    Block, World: World_, Actor, Player: Player_, ScriptSupportEvent,
    ClientCurGame, Chat, Game, Area, Trigger, UI,
    GetS,
    // 便捷全局（部分官方脚本直接用）
    print: log,
  };
}

(function(){

  const r = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  cv.style.width=r.width+'px'; cv.style.height=r.height+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);

  handlers: {},
  stats: {blocks:0, mobs:0, events:0, items:0},
  interp: null,
  on(name, fn){ (this.handlers[name] = this.handlers[name]||[]).push(fn); },
  off(name){ delete this.handlers[name]; },
  emit(name, e){
    const hs = this.handlers[name];
    if(!hs) return;
    for(const fn of hs){
      try{
        if(this.interp) this.interp.call(fn, [e||{}]);
        else if(typeof fn === 'function') fn(e||{});
      }catch(err){ this.log('✗ 事件['+name+']回调出错: '+err.message, 'err'); }
    }
  },
  log(msg, cls){ addLog(msg, cls||'info'); },

  conEl.scrollTop = conEl.scrollHeight;
  while(conEl.children.length>300) conEl.removeChild(conEl.firstChild);
}
const chatEl = document.getElementById('chatbox');
function addChat(msg){
  const d=document.createElement('div');
  d.className='chatline'; d.textContent=String(msg);
  chatEl.appendChild(d);

  addLog(msg,'chat');
}

/* ---------- 解释器 ---------- */
let interp = new Interp(null);
interp.hooks.log = s => addLog(s,'info');
bus.interp = interp;
const api = buildAPI(world, player, bus);
Object.assign(interp.api, api);

function runScript(src, quiet){
  if(!quiet) addLog('— 开始执行脚本 —','info');
  try{
    bus.handlers = {};      // 重新运行前清空旧事件
    interp = new Interp(null);
    interp.hooks.log = s => addLog(s,'info');
    Object.assign(interp.api, api);
    bus.interp = interp;
    interp.run(src);
    // 触发 Game.Start（模拟进入地图）
    bus.emit('Game.Start', {});
    if(!quiet) addLog('脚本执行完毕，已触发 Game.Start','ok');
    updateStats();
    return true;
  }catch(err){
    addLog('脚本错误: '+err.message,'err');
    return false;
  }
}
function updateStats(){
  document.getElementById('s-block').textContent='方块 '+bus.stats.blocks;
  document.getElementById('s-mob').textContent='生物 '+world.mobs.length;
  document.getElementById('s-ev').textContent='事件 '+Object.keys(bus.handlers).length;
}

/* ---------- 预设脚本（真实迷你世界 API 写法） ---------- */


/* ---------- 预设按钮 ---------- */
const psEl = document.getElementById('presets');
PRESETS.forEach((p,i)=>{
  const b=document.createElement('button');
  b.className='ps';
  b.innerHTML='<b>'+p.t+'</b><span>'+p.d+'</span>';
  b.onclick=()=>{
    document.getElementById('code').value=p.s;
    switchTab('p-code');
    runScript(p.s);
    addLog('已载入预设：'+p.t,'ok');
  };
  psEl.appendChild(b);
});

/* ---------- Tab ---------- */
function switchTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.p===id));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.id===id));
}
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>switchTab(t.dataset.p);
});

/* ---------- 运行 ---------- */
const codeEl = document.getElementById('code');
const runBtn = document.getElementById('run');
runBtn.onclick=()=>{ runScript(codeEl.value); };

/* ---------- 摇杆 ---------- */
const joy=document.getElementById('joy'), knob=document.getElementById('knob');
let jx=0, jy=0, joyActive=false;
function joyStart(e){ joyActive=true; joyMove(e); }
function joyMove(e){
  if(!joyActive) return;
  const r=joy.getBoundingClientRect();
  const t=e.touches? e.touches[0] : e;
  let dx=(t.clientX-r.left)-r.width/2, dy=(t.clientY-r.top)-r.height/2;
  const max=r.width/2-14, d=Math.hypot(dx,dy);
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  jx=dx/max; jy=dy/max;
}
function joyEnd(){ joyActive=false; jx=jy=0; knob.style.transform=''; }
joy.addEventListener('touchstart',e=>{e.preventDefault();joyStart(e);},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();joyMove(e);},{passive:false});
joy.addEventListener('touchend',joyEnd);
joy.addEventListener('mousedown',joyStart);
window.addEventListener('mousemove',joyMove);
window.addEventListener('mouseup',joyEnd);

/* ---------- 动作 ---------- */
document.getElementById('btn-jump').onclick=()=>{ player.y+=1; addLog('跳跃'); };
document.getElementById('btn-hit').onclick=()=>{
  // 攻击：清除最近的生物
  if(world.mobs.length===0){ addLog('附近没有生物','warn'); return; }
  let best=null,bd=1e9;
  for(const m of world.mobs){
    const d=Math.hypot(m.x-player.x,m.z-player.z);
    if(d<bd){bd=d;best=m;}
  }
  if(bd<3){
    const i=world.mobs.indexOf(best); world.mobs.splice(i,1);
    bus.emit('Actor.Die',{objid:best.objid});
    addLog('击杀 objid='+best.objid+'（触发 Actor.Die）','ok');
  } else addLog('生物太远，靠近后再攻击','warn');
};

/* ---------- 点击方块 ---------- */
cv.addEventListener('click', e=>{
  const r=cv.getBoundingClientRect();
  const sx=e.clientX-r.left - size.w/2 - renderer.camX;
  const sy=e.clientY-r.top - size.h*0.30 - renderer.camY;
  // 反算最近的列
  let best=null,bd=1e9;
  for(let x=0;x<W;x++) for(let z=0;z<D;z++){
    const h=world.heightAt(x,z); if(h<0) continue;
    const p=renderer.iso(x,h,z);
    const d=Math.hypot(p.sx-sx,p.sy-sy);
    if(d<bd){bd=d;best={x,y:h,z};}
  }
  if(best && bd<40){
    const id=world.get(best.x,best.y,best.z);
    addLog('点击方块 ('+best.x+','+best.y+','+best.z+') = '+blockName(id));
    bus.emit('Player.ClickBlock',{x:best.x,y:best.y,z:best.z,blockid:id});
    renderer.highlight=best;
    setTimeout(()=>{renderer.highlight=null;},600);
  }
});

/* ---------- 主循环 ---------- */
let frame=0;
function loop(){
  frame++;
  world.tick++;
  // 玩家移动
  if(joyActive && (Math.abs(jx)>0.15||Math.abs(jy)>0.15)){
    const sp=0.09;
    player.move(jx*sp, jy*sp);
  }
  // 生物
  for(const m of world.mobs) m.update();
  // 事件：Game.RunTime 每帧
  bus.emit('Game.RunTime',{tick:world.tick});
  // 相机跟随玩家
  const pp=renderer.iso(player.x,player.y,player.z);
  renderer.camX += (-pp.sx - renderer.camX)*0.12;
  renderer.camY += (-pp.sy - renderer.camY)*0.12;
  // 渲染
  renderer.render(player, renderer.highlight);
  if(frame%30===0) updateStats();
  requestAnimationFrame(loop);
}

/* ---------- 启动 ---------- */
world.genTerrain('平坦');
addLog('世界已生成：32×32×12，'+'平坦地形','ok');
addLog('提示：点「预设」按钮可直接测试各种 API','info');
addLog('API 对象：Block / World / Actor / Player / ScriptSupportEvent / ClientCurGame / Chat / Game / Area / Trigger / UI','info');
codeEl.value = PRESETS[0].s;
loop();
})();
</script>
